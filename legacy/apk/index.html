<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5B49">
<title>NutriPlan</title>
<style>
html,body{margin:0;height:100%;background:#EBF0ED;color:#12302A;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.s{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;box-sizing:border-box}
.l{width:84px;height:84px;border-radius:24px;background:#f9d270;display:grid;place-items:center;box-shadow:0 10px 30px -14px rgba(18,48,42,.5)}
.l svg{width:62px;height:62px}
h1{margin:0;font-size:24px;letter-spacing:-.02em}
p{margin:0;color:#5B6E68;max-width:320px;line-height:1.5}
.b{width:28px;height:28px;border-radius:50%;border:3px solid #DCEAE3;border-top-color:#1E5B49;animation:r 0.9s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
button{border:0;border-radius:14px;background:#1E5B49;color:#fff;font-size:16px;font-weight:700;padding:13px 22px}
.h{display:none}
</style>
</head>
<body>
<div class="s">
 <div class="l"><svg viewBox="0 0 64 64"><path d="M20 30c-9-6-12-17-6-24 12 2 20 9 20 23" fill="#91D6A1"/><path d="M31 29c-2-11 3-22 18-25 2 14-5 23-18 29" fill="#3F9B64"/><path d="M24 30C25 20 31 13 39 10" fill="none" stroke="#1D663C" stroke-width="2.8" stroke-linecap="round"/><path d="M11 34h42c-2 14-10 22-21 22S13 48 11 34Z" fill="#1C6A42"/><path d="M12 34h40" stroke="#B5E9BE" stroke-width="4" stroke-linecap="round"/><path d="M21 51c7 5 15 5 22 0" fill="none" stroke="#A1DCAE" stroke-width="3" stroke-linecap="round"/><path d="M26 57h12" stroke="#1C6A42" stroke-width="3.5" stroke-linecap="round"/></svg></div>
 <h1>NutriPlan</h1>
 <div class="b" id="spin"></div>
 <p id="msg">Cargando la última versión…</p>
 <button id="retry" class="h" type="button">Reintentar</button>
</div>
<script>
(function(){
 var ORIGIN='https://nutriplan-asesoria.vercel.app';
 var KEY='np-shell-html';
 function inject(html){
  var head='<base href="'+ORIGIN+'/"><script>window.NP_ORIGIN="'+ORIGIN+'";window.NP_APP="android";<\/script>';
  return /<head[^>]*>/i.test(html)?html.replace(/<head[^>]*>/i,function(m){return m+head}):head+html;
 }
 function show(html){document.open();document.write(inject(html));document.close()}
 function fail(text){
  document.getElementById('spin').className='h';
  document.getElementById('msg').textContent=text;
  var b=document.getElementById('retry');b.className='';b.onclick=function(){location.reload()};
 }
 var done=false,cached=null;
 try{cached=localStorage.getItem(KEY)}catch(e){}
 var timer=setTimeout(function(){if(!done&&cached){done=true;show(cached)}},9000);
 fetch(ORIGIN+'/?app=android&t='+Date.now(),{cache:'no-store'}).then(function(r){
  if(!r.ok)throw Error('HTTP '+r.status);return r.text();
 }).then(function(html){
  if(!/NutriPlan/.test(html))throw Error('respuesta no válida');
  try{localStorage.setItem(KEY,html)}catch(e){}
  if(!done){done=true;clearTimeout(timer);show(html)}
 }).catch(function(){
  if(done)return;done=true;clearTimeout(timer);
  if(cached)show(cached);else fail('No hay conexión a internet. NutriPlan necesita conexión la primera vez que se abre.');
 });
})();
</script>
</body>
</html>
